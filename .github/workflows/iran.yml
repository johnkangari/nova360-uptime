name: Iran reachability

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iran-log
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node check.mjs --iran
        continue-on-error: true
      - name: Save log
        run: |
          git config user.name "uptime"
          git config user.email "uptime@users.noreply.github.com"
          git add log/iran.csv
          git commit -m "Iran check $(date -u +%Y-%m-%dT%H:%M)" && git push || true
      - if: steps.check.outcome == 'failure'
        run: exit 1
